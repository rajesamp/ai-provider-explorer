version: 2
updates:
  # Application dependencies (npm).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk updates to reduce PR noise; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the pinned GitHub Actions SHAs current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
