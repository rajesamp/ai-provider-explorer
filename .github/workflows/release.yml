name: Release

# Runs only for version tags (e.g. v1.2.3). Produces a reproducible build,
# an SBOM, and a keyless (OIDC/Sigstore) SLSA build-provenance attestation
# for the distributable artifact. No long-lived signing secrets are used.
on:
  push:
    tags:
      - 'v*'

# Default to read-only; each job elevates only the scopes it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required by actions/attest-build-provenance for keyless OIDC signing.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package distributable
        run: |
          tar -czf ai-provider-explorer-${{ github.ref_name }}.tar.gz -C dist .
          sha256sum ai-provider-explorer-${{ github.ref_name }}.tar.gz > SHA256SUMS

      - name: Generate SBOM (CycloneDX + SPDX)
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attest build provenance (keyless / Sigstore)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: ai-provider-explorer-${{ github.ref_name }}.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-${{ github.ref_name }}
          path: |
            ai-provider-explorer-${{ github.ref_name }}.tar.gz
            SHA256SUMS
            sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error
