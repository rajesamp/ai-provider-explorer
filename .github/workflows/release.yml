name: Release

# Runs only for version tags (e.g. v1.2.3). Produces a reproducible build,
# an SBOM, and a keyless (OIDC/Sigstore) SLSA build-provenance attestation
# for the distributable artifact. No long-lived signing secrets are used.
on:
  push:
    tags:
      - 'v*'

# Default to read-only; each job elevates only the scopes it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required by actions/attest-build-provenance for keyless OIDC signing.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package distributable
        run: |
          tar -czf ai-provider-explorer-${{ github.ref_name }}.tar.gz -C dist .
          sha256sum ai-provider-explorer-${{ github.ref_name }}.tar.gz > SHA256SUMS

      - name: Generate SBOM (CycloneDX + SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attest build provenance (keyless / Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ai-provider-explorer-${{ github.ref_name }}.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            ai-provider-explorer-${{ github.ref_name }}.tar.gz
            SHA256SUMS
            sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error
